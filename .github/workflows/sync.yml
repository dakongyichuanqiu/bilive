name: Sync from Upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream and sync main
        run: |
          git remote add upstream https://github.com/timerring/bilive.git
          git fetch upstream --tags --prune
          git checkout main
          if git merge --ff-only upstream/main 2>/dev/null; then
            echo "fast-forwarded to upstream/main"
          else
            git merge --no-edit upstream/main
          fi
          git rm --ignore-unmatch --cached .github/workflows/deploy.yml .github/workflows/stale.yml >/dev/null 2>&1 || true
          rm -f .github/workflows/deploy.yml .github/workflows/stale.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore: drop upstream workflows that fail on forks (deploy/stale)"
          else
            echo "no workflow cleanup needed"
          fi
          git push origin main --tags

      - name: Keepalive (prevent scheduled workflow auto-disable)
        run: |
          set -e
          # GitHub disables scheduled workflows after 60 days without repository
          # activity. When the upstream repo is unchanged, the sync above pushes
          # nothing, so refresh a heartbeat file roughly every 20 days to keep
          # the schedule alive without generating noisy commits.
          file=.github/keepalive
          today=$(date -u +%Y-%m-%d)
          last=""
          [ -f "$file" ] && last=$(cat "$file")
          if [ "$last" = "$today" ]; then
            echo "keepalive already recorded today"
            exit 0
          fi
          if [ -n "$last" ]; then
            last_epoch=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            now_epoch=$(date -u +%s)
            age_days=$(( (now_epoch - last_epoch) / 86400 ))
          else
            age_days=999
          fi
          if [ "$age_days" -lt 20 ]; then
            echo "keepalive is fresh (${age_days}d old); nothing to do"
            exit 0
          fi
          printf '%s\n' "$today" > "$file"
          git add "$file"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: keepalive to retain scheduled upstream sync"
          git push origin main
